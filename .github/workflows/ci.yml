name: CI
on:
  pull_request:
  push:
    branches: [main, master, revival]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fail on high/critical vulnerabilities
        run: npm audit --audit-level=high
      - run: npx gatsby build
